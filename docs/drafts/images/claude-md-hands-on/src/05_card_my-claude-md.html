<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>:root{--bg:#FAF7F2;--card:#FFFFFF;--ink:#1F2937;--sub:#6B7280;--line:#E8E1D6;
      --accent:#C8553D;--accent-soft:#F6E3DC;--ok:#2F6F5E;--ok-soft:#DDEDE7;
      --edge:#D9CDB8;--accent-dark:#9E3F2B;--shadow:rgba(31,41,55,.18)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:"Pretendard","Noto Sans KR","Noto Sans CJK KR","Malgun Gothic","Apple SD Gothic Neo","NanumGothic","WenQuanYi Zen Hei",sans-serif;color:var(--ink);
     -webkit-font-smoothing:antialiased;word-break:keep-all;line-height:1.35}
.canvas{width:1080px;padding:80px 90px 110px 80px;background:var(--bg);position:relative}
.square{height:1080px;display:flex;flex-direction:column;justify-content:center}
.kicker{font-size:36px;font-weight:600;color:var(--accent);margin-bottom:28px}
h1{font-size:84px;font-weight:800;line-height:1.2;letter-spacing:-1px}
h2{font-size:56px;font-weight:800;line-height:1.25;margin-bottom:56px}
.sub{font-size:40px;color:var(--sub);margin-top:28px}
code{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Noto Sans Mono CJK KR","WenQuanYi Zen Hei Mono",monospace;
           font-size:34px;background:var(--accent-soft);padding:2px 12px;border-radius:10px}
.num{display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;
     border-radius:50%;background:var(--accent);color:#fff;font-size:34px;font-weight:700;flex:none}
.solid{background:var(--card);border:3px solid var(--ink);border-radius:24px;
  box-shadow:4px 4px 0 var(--ink),8px 8px 0 var(--edge),16px 28px 36px var(--shadow)}
.solid.hot{background:var(--accent-soft);
  box-shadow:4px 4px 0 var(--ink),8px 8px 0 var(--accent-dark),16px 28px 36px var(--shadow)}
svg.line{width:72px;height:72px;fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.line .hot{stroke:var(--accent)}
.row{display:flex;align-items:center;gap:22px;padding:22px 32px;margin-bottom:34px}
.row:last-of-type{margin-bottom:0}
.row .t{display:flex;flex-direction:column}
.row .lab{font-size:44px;font-weight:700}
.row .val{color:var(--sub);font-size:36px}
.list{margin-top:48px;margin-right:30px}
.list .row{font-size:42px;font-weight:700;padding:16px 28px;margin-bottom:28px}
.tbl{overflow:hidden;margin-right:8px}
table{width:100%;border-collapse:collapse;font-size:38px}
th,td{padding:22px 20px;text-align:left;border-bottom:3px solid var(--line);vertical-align:middle}
th{font-size:36px;background:var(--bg)}th.ok{color:var(--ok)}th.no{color:var(--accent)}
td:first-child{font-weight:700}tr:last-child td{border-bottom:none}
.c1{display:flex;align-items:center;gap:14px}
.flow{display:flex;flex-direction:column;align-items:stretch;margin-right:8px}
.node{display:flex;align-items:center;gap:24px;padding:22px 32px}
.node b{font-size:44px}.node small{font-size:34px;color:var(--sub);margin-left:auto}
.arr{height:56px;display:flex;justify-content:center;align-items:center}
.arr svg{width:40px;height:48px;fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.note{font-size:34px;color:var(--sub);margin-top:56px}
</style></head><body><div class="canvas"><h2>제 CLAUDE.md의 5가지</h2><div class="row solid hot"><span class="num">1</span><svg class="line" style="width:72px;height:72px" viewBox="0 0 48 48"><path class="hot" d="M5 9h38v30H5z"/><path d="M13 19l6 5-6 5"/><path d="M24 31h10"/></svg><span class="t"><span class="lab">명령</span><span class="val">실행·테스트 명령</span></span></div><div class="row solid"><span class="num">2</span><svg class="line" style="width:72px;height:72px" viewBox="0 0 48 48"><path d="M24 6L44 41H4z"/><path d="M24 18v10"/><path d="M24 35v.01"/></svg><span class="t"><span class="lab">함정</span><span class="val">놓치기 쉬운 설정</span></span></div><div class="row solid"><span class="num">3</span><svg class="line" style="width:72px;height:72px" viewBox="0 0 48 48"><circle cx="24" cy="24" r="19"/><path d="M11 11l26 26"/></svg><span class="t"><span class="lab">하지 말 것</span><span class="val">금지와 그 이유</span></span></div><div class="row solid"><span class="num">4</span><svg class="line" style="width:72px;height:72px" viewBox="0 0 48 48"><path d="M8 5h14v11H8z"/><path d="M15 16v23"/><path d="M15 26h12"/><path d="M15 39h12"/><path d="M27 20h14v12H27z"/><path d="M27 33h14v12H27z" transform="translate(0 -1)"/></svg><span class="t"><span class="lab">구조</span><span class="val">폴더와 계층</span></span></div><div class="row solid"><span class="num">5</span><svg class="line" style="width:72px;height:72px" viewBox="0 0 48 48"><path d="M7 41l2-10L31 9l8 8-22 22z"/><path d="M27 13l8 8"/></svg><span class="t"><span class="lab">규칙</span><span class="val">에이전트 파일 작성</span></span></div><div class="note">6개 섹션, 67줄 정도</div></div></body></html>
