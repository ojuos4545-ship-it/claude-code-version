<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>:root{--bg:#FAF7F2;--card:#FFFFFF;--ink:#1F2937;--sub:#6B7280;--line:#E8E1D6;
      --accent:#C8553D;--accent-soft:#F6E3DC;--ok:#2F6F5E;--ok-soft:#DDEDE7}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:"Pretendard","Noto Sans KR","Noto Sans CJK KR","Malgun Gothic","Apple SD Gothic Neo","NanumGothic","WenQuanYi Zen Hei",sans-serif;color:var(--ink);
     -webkit-font-smoothing:antialiased;word-break:keep-all;line-height:1.35}
.canvas{width:1080px;padding:80px;background:var(--bg)}
.square{height:1080px;display:flex;flex-direction:column;justify-content:center}
.kicker{font-size:36px;font-weight:600;color:var(--accent);margin-bottom:28px}
h1{font-size:84px;font-weight:800;line-height:1.2;letter-spacing:-1px}
h2{font-size:56px;font-weight:800;line-height:1.25;margin-bottom:48px}
.sub{font-size:40px;color:var(--sub);margin-top:28px}
code,.mono{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Noto Sans Mono CJK KR","WenQuanYi Zen Hei Mono",monospace;
           font-size:34px;background:var(--accent-soft);padding:2px 12px;border-radius:10px}
.num{display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;
     border-radius:50%;background:var(--accent);color:#fff;font-size:34px;font-weight:700;flex:none}
.row{display:flex;align-items:center;gap:24px;font-size:44px;background:var(--card);
 border:2px solid var(--line);border-radius:24px;padding:28px 36px;margin-bottom:24px}
.row .lab{font-weight:700;flex:none}
.row .val{color:var(--sub);font-size:38px}
.list{margin-top:56px}
.list .row{font-size:42px;padding:20px 32px;margin-bottom:16px}
table{width:100%;border-collapse:collapse;background:var(--card);border:2px solid var(--line);border-radius:24px;overflow:hidden;font-size:38px}
th,td{padding:28px 24px;text-align:left;border-bottom:2px solid var(--line)}
th{font-size:36px;background:var(--bg)}th.ok{color:var(--ok)}th.no{color:var(--accent)}
td:first-child{font-weight:700}tr:last-child td{border-bottom:none}
.flow{display:flex;flex-direction:column;align-items:stretch;gap:8px}
.node{display:flex;align-items:center;gap:28px;background:var(--card);border:2px solid var(--line);border-radius:24px;padding:28px 36px}
.node b{font-size:44px}.node small{font-size:34px;color:var(--sub);margin-left:auto}
.arrow{font-size:48px;color:var(--accent);font-weight:700;text-align:center;line-height:1}
.note{font-size:34px;color:var(--sub);margin-top:24px}
</style></head><body><div class="canvas"><h2>적어 둘 내용 4가지</h2><div class="row"><span class="num">1</span><span class="lab">확인 명령</span><span class="val">테스트, 린트, 하나만 실행</span></div><div class="row"><span class="num">2</span><span class="lab">오해할 곳</span><span class="val">쓰면 안 되는 옛 패턴</span></div><div class="row"><span class="num">3</span><span class="lab">저장소 밖 결정</span><span class="val">팀 약속, 배포 방식</span></div><div class="row"><span class="num">4</span><span class="lab">두 번 교정한 것</span><span class="val">같은 말을 반복했다면</span></div></div></body></html>
