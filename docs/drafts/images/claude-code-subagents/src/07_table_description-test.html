<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>비교표</title>
<style>:root{--bg:#0B0C10;--card:#14161C;--ink:#EDEEF2;--sub:#A9AEBC;--line:#2A2D37;
      --accent:#9A8EF7;--accent-soft:#25213F;--ok:#5EC8E5;--ok-soft:#12303A}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0B0C10}
body{font-family:"Pretendard","Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",
     "Apple SD Gothic Neo","NanumGothic",sans-serif;color:#EDEEF2;
     -webkit-font-smoothing:antialiased;word-break:keep-all;line-height:1.4}
.canvas{width:1080px;padding:80px;background:#0B0C10}
/* 표본 바탕: #0B0C10 + 오른쪽 위 아주 은은한 보라 빛 */
.canvas.dk{padding:84px 80px 92px;display:flex;flex-direction:column;gap:56px;
  background:radial-gradient(circle at 92% 0%,rgba(154,142,247,.15),rgba(154,142,247,0) 38%),#0B0C10}
/* 머리: 하늘색 번호 + 굵은 흰 제목 + 얇은 구분선 (h2를 쓰지 않아 테마의 3D 블록이 붙지 않음) */
.head{display:flex;flex-direction:column;gap:30px}
.hrow{display:flex;align-items:baseline;gap:26px}
.no{flex:none;font-size:36px;font-weight:600;letter-spacing:.16em;color:#5EC8E5}
.ht{font-size:60px;font-weight:800;line-height:1.25;letter-spacing:-.01em;color:#F4F5F8}
.rule{height:2px;background:rgba(255,255,255,.12)}
.cd{font-family:"JetBrains Mono","PretendardBlog","Pretendard",monospace;font-weight:700;color:#CFC8FF;letter-spacing:-.02em;word-spacing:-.18em}
.foot{font-size:36px;line-height:1.5;color:#A9AEBC}
.tb{background:#14161C;border:2px solid rgba(255,255,255,.14);border-radius:28px;overflow:hidden}
.tr{display:grid;align-items:center;border-top:2px solid rgba(255,255,255,.08)}
.tr:first-child{border-top:none}
.th{background:#1A1D25}
.th>div{font-size:36px;font-weight:600;color:#A9AEBC;padding:26px 36px}
.td{padding:32px 36px}
.rl{font-size:40px;font-weight:700;color:#F4F5F8}
.wrap{display:flex;flex-direction:column;gap:32px}
.tr{grid-template-columns:1fr 300px}
.td .rl{display:block}
.rs{display:block;margin-top:8px;font-size:36px;color:#A9AEBC}
.ct{display:flex;align-items:center;gap:22px}
.n{font-size:48px;font-weight:800;color:#F4F5F8;min-width:84px}
.n.full{color:#5EC8E5}
.dt{display:flex;gap:10px}
.dt i{width:24px;height:24px;border-radius:50%;border:3px solid rgba(255,255,255,.28)}
.dt i.on{background:#5EC8E5;border-color:#5EC8E5}</style></head>
<body><div class="canvas dk">
<div class="head"><div class="hrow"><span class="no">04</span><div class="ht">설명이 구체적일수록 더 맡김</div></div><div class="rule"></div></div>
<div class="wrap">
<div class="tb">
<div class="tr th"><div>description</div><div>맡긴 횟수</div></div>
<div class="tr"><div class="td"><b class="rl">모호</b><span class="rs">“도움을 준다.”</span></div><div class="td ct"><b class="n">0/3</b><span class="dt"><i class=""></i><i class=""></i><i class=""></i></span></div></div>
<div class="tr"><div class="td"><b class="rl">구체적</b><span class="rs">할 일 + 맡길 상황</span></div><div class="td ct"><b class="n">1/3</b><span class="dt"><i class="on"></i><i class=""></i><i class=""></i></span></div></div>
<div class="tr"><div class="td"><b class="rl">구체적 + Use proactively</b><span class="rs">+ 반드시 먼저 맡기라는 문구</span></div><div class="td ct"><b class="n full">3/3</b><span class="dt"><i class="on"></i><i class="on"></i><i class="on"></i></span></div></div>
</div>
<p class="foot">2026-10-28, 같은 리뷰 요청 각 3회</p>
</div>
</div></body></html>
