<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>다이어그램</title>
<style>:root{--bg:#FAF7F2;--card:#FFFFFF;--ink:#1F2937;--sub:#6B7280;--line:#E8E1D6;
      --accent:#C8553D;--accent-soft:#F6E3DC;--ok:#2F6F5E;--ok-soft:#DDEDE7}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:"Pretendard","Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",
     "Apple SD Gothic Neo","NanumGothic","WenQuanYi Zen Hei",sans-serif;color:var(--ink);
     -webkit-font-smoothing:antialiased;word-break:keep-all;line-height:1.35}
.canvas{width:1080px;padding:80px;background:var(--bg)}
.square{height:1080px;display:flex;flex-direction:column;justify-content:center}
.kicker{font-size:36px;font-weight:600;color:var(--accent);margin-bottom:28px}
h1{font-size:84px;font-weight:800;line-height:1.2;letter-spacing:-1px}
h2{font-size:56px;font-weight:800;line-height:1.25;margin-bottom:48px}
.sub{font-size:40px;color:var(--sub);margin-top:28px}
code,.mono{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Noto Sans Mono CJK KR",monospace;
           font-size:34px;background:var(--accent-soft);padding:2px 12px;border-radius:10px}
.num{display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;
     border-radius:50%;background:var(--accent);color:#fff;font-size:34px;font-weight:700;flex:none}
.flow{display:flex;flex-direction:column;gap:0}
.node{display:flex;align-items:center;gap:28px;background:var(--card);border:2px solid var(--line);
 border-radius:24px;padding:24px 32px}
.node .col{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.node b{font-size:44px}.node small{font-size:36px;color:var(--sub)}
.node b.mono{font-size:34px;padding:4px 14px}
.arrow{height:52px;display:flex;align-items:center;padding-left:46px;color:var(--accent)}
.foot{font-size:36px;color:var(--sub);margin-top:30px}
.node{padding:18px 30px}.arrow{height:44px}.node .col{gap:6px}h2{margin-bottom:40px}
.branch{display:flex;gap:16px}
.opt{flex:1;display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px solid rgba(255,255,255,.12);
 border-radius:24px;padding:22px 20px;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.opt b{font-size:38px}.opt small{font-size:36px;color:var(--sub)}</style></head>
<body><div class="canvas"><h2>플랜 모드는 계획 먼저</h2>
<div class="flow">
<div class="node"><span class="num">1</span><span class="col"><b>플랜 모드 들어가기</b><small><code>Shift+Tab</code> 또는 <code>/plan</code></small></span></div><div class="arrow"><svg width="40" height="44" viewBox="0 0 40 44"><path d="M20 4v32M8 24l12 12 12-12" fill="none" stroke="#7B6CF0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
<div class="node"><span class="num">2</span><span class="col"><b>탐색과 계획 작성</b><small>소스 파일은 그대로</small></span></div><div class="arrow"><svg width="40" height="44" viewBox="0 0 40 44"><path d="M20 4v32M8 24l12 12 12-12" fill="none" stroke="#7B6CF0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
<div class="node"><span class="num">3</span><span class="col"><b>계획 검토 후 선택</b><small><code>Ctrl+G</code>로 직접 수정 가능</small></span></div><div class="arrow"><svg width="40" height="44" viewBox="0 0 40 44"><path d="M20 4v32M8 24l12 12 12-12" fill="none" stroke="#7B6CF0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
<div class="branch">
<div class="opt"><b>auto로 실행</b><small>승인 후 auto</small></div>
<div class="opt"><b>하나씩 확인</b><small>편집마다 승인</small></div>
<div class="opt"><b>계속 계획</b><small>플랜 모드 유지</small></div>
</div></div></div></body></html>
