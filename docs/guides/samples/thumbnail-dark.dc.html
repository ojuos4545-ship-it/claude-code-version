<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>CLAUDE.md 작성법 썸네일</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&amp;family=Inter:wght@400;600&amp;display=swap">
<style>
body{margin:0}
a{color:#B9B0FF}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 720px; height: 720px; box-sizing: border-box; position: relative; overflow: hidden; background: {{bg}}; font-family: 'IBM Plex Sans KR', 'Inter', system-ui, sans-serif; color: #EDEEF2">
<svg width="720" height="720" viewBox="0 0 720 720" style="position: absolute; left: 0; top: 0" aria-hidden="true">
<defs>
<radialGradient id="dglow" cx="76%" cy="24%" r="38%">
<stop offset="0%" stop-color="{{accent}}" stop-opacity="0.38"></stop>
<stop offset="100%" stop-color="{{accent}}" stop-opacity="0"></stop>
</radialGradient>
<linearGradient id="pageFront" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#E9E5FF" stop-opacity="0.95"></stop>
<stop offset="100%" stop-color="{{accent}}" stop-opacity="0.75"></stop>
</linearGradient>
<linearGradient id="pageSide" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="{{accent}}"></stop>
<stop offset="100%" stop-color="#1A1740"></stop>
</linearGradient>
</defs>
<rect width="720" height="720" fill="url(#dglow)"></rect>
<ellipse cx="548" cy="262" rx="92" ry="14" fill="#000000" opacity="0.6"></ellipse>
<polygon points="600,96 622,108 622,248 600,236" fill="url(#pageSide)"></polygon>
<polygon points="490,96 600,96 600,236 490,236" fill="url(#pageFront)" stroke="#ffffff" stroke-opacity="0.4"></polygon>
<polygon points="490,96 512,108 622,108 600,96" fill="#F4F1FF" opacity="0.6"></polygon>
<g stroke="#1A1740" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round">
<line x1="512" y1="138" x2="578" y2="138"></line>
<line x1="512" y1="160" x2="578" y2="160"></line>
<line x1="512" y1="182" x2="560" y2="182"></line>
<line x1="512" y1="204" x2="570" y2="204"></line>
</g>
<circle cx="636" cy="80" r="5" fill="{{accent2}}"></circle>
</svg>
<div style="position: absolute; left: 56px; top: 56px; width: 400px; display: flex; flex-direction: column; gap: 14px">
<span style="font-size: 16px; font-weight: 600; color: {{accent2}}">클로드 코드</span>
<h2 style="margin: 0; font-size: 54px; line-height: 1.18; font-weight: 700; letter-spacing: -0.02em; color: #F4F5F8">CLAUDE.md<br>작성법</h2>
<p style="margin: 0; font-size: 19px; color: #A9AEBC">입문자용 3단계</p>
</div>
<div style="position: absolute; left: 56px; right: 56px; bottom: 56px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 18px; padding: 20px 24px; border-radius: 16px; background: {{surface}}; border: 1px solid rgba(255,255,255,0.12)">
<span style="width: 36px; height: 36px; border-radius: 50%; background: {{accent}}; display: flex; align-items: center; justify-content: center; font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 600; color: #ffffff">1</span>
<span style="font-size: 22px; font-weight: 600; color: #EDEEF2">위치와 초안</span>
</div>
<div style="display: flex; align-items: center; gap: 18px; padding: 20px 24px; border-radius: 16px; background: {{surface}}; border: 1px solid rgba(255,255,255,0.12)">
<span style="width: 36px; height: 36px; border-radius: 50%; background: {{accent}}; display: flex; align-items: center; justify-content: center; font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 600; color: #ffffff">2</span>
<span style="font-size: 22px; font-weight: 600; color: #EDEEF2">적고 지우기</span>
</div>
<div style="display: flex; align-items: center; gap: 18px; padding: 20px 24px; border-radius: 16px; background: {{surface}}; border: 1px solid rgba(255,255,255,0.12)">
<span style="width: 36px; height: 36px; border-radius: 50%; background: {{accent}}; display: flex; align-items: center; justify-content: center; font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 600; color: #ffffff">3</span>
<span style="font-size: 22px; font-weight: 600; color: #EDEEF2">확인하고 갱신</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"bg":{"editor":"color","default":"#0B0C10"},"surface":{"editor":"color","default":"#16181F"},"accent":{"editor":"color","default":"#7B6CF0"},"accent2":{"editor":"color","default":"#5EC8E5"},"$preview":{"width":720,"height":720}}'>
class Component extends DCLogic {
renderVals() {
return {
bg: this.props.bg ?? '#0B0C10',
surface: this.props.surface ?? '#16181F',
accent: this.props.accent ?? '#7B6CF0',
accent2: this.props.accent2 ?? '#5EC8E5'
};
}
}
</script>
</body>
</html>
